[package]
name = "lib-duckcount"
version = "0.6.0"
edition = "2024"

[dependencies]
# Common
uniffi = "0.29.4" # MPL-2.0

# Algorithm
thiserror = "2.0.18"    # Apache-2.0 OR MIT
uuid = "1.20.0"         # Apache-2.0 OR MIT
bigdecimal = "0.4.10"   # MIT OR Apache-2.0

# Cryptography
rand = "0.8.5" # MIT OR Apache-2.0
argon2 = "0.5.3" # MIT OR Apache-2.0
opaque-ke = { version = "3.0.0", features = [
    "argon2",
    "ristretto255",
] } # MIT OR Apache-2.0
aes-gcm = "0.10.3" # Apache-2.0 OR MIT
aes-siv = "0.7.0" # Apache-2.0 OR MIT
hkdf = "0.12.4" # MIT OR Apache-2.0
sha3 = "0.10.8" # MIT OR Apache-2.0
serde = { version = "1.0.228", features = ["rc"] } # MIT OR Apache-2.0
serde_json = "1.0.149" # MIT OR Apache-2.0
base64 = "0.22.1" # MIT OR Apache-2.0
openmls = "0.8.0" # MIT

[dev-dependencies]
# Algorithm
uuid = { version = "1.20.0", features = ["v4"] } # Apache-2.0 OR MIT

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
path = "rust/src/lib.rs"
