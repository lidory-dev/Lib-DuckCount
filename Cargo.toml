[package]
name = "lib-duckcount"
version = "1.0.1"
edition = "2024"

[dependencies]
# Common
uniffi = "0.29.4" # MPL-2.0

# Algorithm
thiserror = "2.0.18"    # Apache-2.0 OR MIT
uuid = { version = "1.20.0", features = ["v8"] } # Apache-2.0 OR MIT
bigdecimal = "0.4.10"   # MIT OR Apache-2.0

# Cryptography
rand = "0.8.5" # MIT OR Apache-2.0
argon2 = "0.5.3" # MIT OR Apache-2.0
opaque-ke = { version = "4.0.1", features = [
    "argon2",
    "ristretto255",
] } # MIT OR Apache-2.0
aes-gcm = "0.10.3" # Apache-2.0 OR MIT
aes-siv = "0.7.0" # Apache-2.0 OR MIT
hkdf = "0.12.4" # MIT OR Apache-2.0
sha2 = "0.10.9" # MIT OR Apache-2.0
sha3 = "0.10.8" # MIT OR Apache-2.0
serde = { version = "1.0.228", features = ["rc"] } # MIT OR Apache-2.0
serde_json = "1.0.149" # MIT OR Apache-2.0
base64 = "0.22.1" # MIT OR Apache-2.0
zeroize = "1.9.0" # Apache-2.0 OR MIT
mls-rs = { version = "0.55.2", features = [
    # Marks a key package as reusable, matching the server's `is_last_resort` column.
    "last_resort_key_package_ext",
    # Lets a departing user propose their own removal on account deletion.
    "self_remove_proposal",
] } # Apache-2.0 OR MIT
mls-rs-core = "0.27.0" # Apache-2.0 OR MIT
mls-rs-codec = "0.7.0" # Apache-2.0 OR MIT
mls-rs-crypto-awslc = { version = "0.25.0", features = ["post-quantum"] } # Apache-2.0 OR MIT
# declared here only to turn its `bindgen` feature on. aws-lc-sys ships
# Not used directly: this is `mls-rs-crypto-awslc`'s own transitive dependency,
# pre-generated bindings for a handful of platforms; none of the Android or iOS
# targets are among them, so without this the cross-compilation of every mobile
# target fails. The feature builds bindings in-process (needs libclang, which
# Xcode provides) instead of requiring each developer to install bindgen-cli.
# The version is pinned exactly, as mls-rs-crypto-awslc pins it, keep the two
# in step when upgrading.
aws-lc-sys = { version = "=0.40.0", features = ["bindgen"] } # ISC AND ( Apache-2.0 OR ISC ) AND Apache-2.0 AND MIT AND BSD-3-Clause AND ( Apache-2.0 OR ISC OR MIT ) AND ( Apache-2.0 OR ISC OR MIT-0 )

[dev-dependencies]
# Algorithm
uuid = { version = "1.20.0", features = ["v4"] } # Apache-2.0 OR MIT

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
path = "rust/src/lib.rs"

# One unit, so that the machine building it has no say in how the code is split.
# Optimized as a whole with every crate it uses, which makes the Android library 4% smaller
# (3.98 MB to 3.83 MB on arm64), aws-lc's C code being out of its reach. Cargo runs it only
# for a build that makes no Rust library (`lib` in `crate-type` above), so only for the
# Android release, which asks for the shared library alone, see build.gradle.kts. iOS gets
# none.
[profile.release]
codegen-units = 1
lto = true

# Unoptimized, Argon2 turns every login in a debug build into seconds of waiting
# (2.4 s per run on a Pixel 7 Pro, against 0.14 s with this). Everything else in
# a debug build stays as it is.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
